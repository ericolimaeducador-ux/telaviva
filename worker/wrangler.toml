# Cloudflare Worker that receives Tela Viva B2B leads and emails them via Resend.
# Secrets (never in this file): RESEND_API_KEY, TURNSTILE_SECRET.
name = "telaviva-leads"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://ericolimaeducador-ux.github.io"
LEAD_TO = "settedistribuidora0777@gmail.com"
# Without a verified domain, Resend only delivers from onboarding@resend.dev
# to the email that owns the Resend account.
LEAD_FROM = "Tela Viva <onboarding@resend.dev>"

# Optional per-IP rate limit (Workers Rate Limiting binding). Enable after
# confirming the binding syntax in the Cloudflare dashboard/docs:
# [[unsafe.bindings]]
# name = "LEAD_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }
